<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Professeur - Live</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- API Jitsi Meet -->
  <script src="https://meet.jit.si/external_api.js"></script>
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon.png">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

  <header class="w-full max-w-4xl flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
    <div>
      <h1 class="text-xl font-bold text-blue-400">Espace Professeur</h1>
      <p class="text-xs text-slate-400">Salle de cours en direct</p>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- Bouton Switch Caméra -->
      <button id="switchCameraBtn" onclick="toggleCameraFacing()" class="hidden items-center gap-2 px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow-lg transition active:scale-95">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Changer de caméra
      </button>

      <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 text-red-400 border border-red-500/20 text-xs font-semibold">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> LIVE
      </span>
    </div>
  </header>

  <main class="w-full max-w-4xl flex-1 my-4 bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-2xl relative min-h-[500px]">
    <div id="jitsi-container" class="w-full h-full min-h-[500px]"></div>
  </main>

  <footer class="w-full max-w-4xl text-center text-xs text-slate-500">
    PWA Live Classe • Mode Enseignant
  </footer>

  <script>
    // Enregistrement du Service Worker PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    const ROOM_NAME = "ClasseVirtuelleProf_UniqueRoom123";
    let api = null;
    let isFrontCamera = true; // Par défaut, caméra avant

    const domain = "meet.jit.si";
    const options = {
      roomName: ROOM_NAME,
      width: '100%',
      height: '100%',
      parentNode: document.querySelector('#jitsi-container'),
      userInfo: {
        displayName: 'Professeur'
      },
      configOverwrite: {
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        disableDeepLinking: true,
        prejoinPageEnabled: false
      },
      interfaceConfigOverwrite: {
        TOOLBAR_BUTTONS: [
          'microphone', 'camera', 'desktop', 'chat', 'raisehand', 
          'tileview', 'fullscreen', 'mute-everyone', 'hangup'
        ],
        SHOW_JITSI_WATERMARK: false
      }
    };

    // Initialisation de Jitsi
    api = new JitsiMeetExternalAPI(domain, options);

    // Une fois que l'API Jitsi est chargée, on vérifie si on est sur mobile pour afficher le bouton
    api.addEventListeners({
      videoConferenceJoined: () => {
        // Détecte si l'appareil possède plusieurs caméras (souvent mobile/tablette)
        navigator.mediaDevices?.enumerateDevices().then(devices => {
          const videoDevices = devices.filter(device => device.kind === 'videoinput');
          if (videoDevices.length > 1) {
            document.getElementById('switchCameraBtn').classList.remove('hidden');
            document.getElementById('switchCameraBtn').classList.add('inline-flex');
          }
        }).catch(err => console.log("Erreur détection caméras:", err));
      }
    });

    // Fonction pour basculer entre la caméra avant et arrière
    async function toggleCameraFacing() {
      try {
        isFrontCamera = !isFrontCamera;
        
        // On demande à Jitsi de changer le périphérique vidéo actif
        // Jitsi gère la liste des caméras disponibles via getAvailableDevices / setVideoInputDevice
        const devices = await api.getAvailableDevices();
        if (devices && devices.videoInput && devices.videoInput.length > 1) {
          // On alterne simplement entre le premier et le second index de caméra détectée
          const targetDevice = devices.videoInput[isFrontCamera ? 0 : 1];
          if (targetDevice && targetDevice.deviceId) {
            api.setVideoInputDevice(targetDevice.label, targetDevice.deviceId);
          }
        }
      } catch (error) {
        console.error("Impossible de basculer la caméra :", error);
      }
    }
  </script>
</body>
</html>
